# Six independent jobs, each with its own status:
# - lint: the pre-commit hooks that need no project environment (ruff check, ruff format, ShellCheck);
# - reuse: copyright and license of every file (REUSE);
# - secrets: gitleaks over the whole git history (the pre-commit hook checks only staged changes);
# - bats: the tests of the shell scripts (tests/bats, bats-core from the submodules there);
# - tests: ty and the test suite with coverage (pytest --cov, 80 % gate), on CPU, with the mesh extra. GDAL and gmsh
#   come from conda-forge, from the environment file of the mesh image (containers/mesh-environment.yml), the Python
#   dependencies from PyPI, as in the images;
# - core: the package without the mesh extra (as the training image installs it): no command but make-ocean-mesh may
#   load gmsh or seamsh, and the tests pass with the mesh tests skipped.
# Hook versions live in .pre-commit-config.yaml only, except gitleaks in the secrets job (a release binary: keep its
# version in sync with the hook's rev).
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Same bound as the dev group (pyproject.toml).
      - name: Install pre-commit
        run: python -m pip install "pre-commit >= 4.7"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Ruff and ShellCheck
        # reuse, gitleaks, bats and ty run in their own jobs (ty needs the project's dependencies).
        env:
          SKIP: reuse,gitleaks,bats,ty
        run: pre-commit run --all-files --show-diff-on-failure

  reuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: python -m pip install "pre-commit >= 4.7"

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-reuse-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: REUSE
        run: pre-commit run reuse --all-files

  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Keep in sync with the gitleaks hook in .pre-commit-config.yaml; the checksum is that of the release asset
      # gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz (gitleaks_${GITLEAKS_VERSION}_checksums.txt of the release).
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history: a secret committed and later removed is still published.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" gitleaks

      - name: Scan the history
        run: ./gitleaks git --redact --verbose --exit-code 1 .

  bats:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # bats-core and its libraries (tests/bats/helpers).
          submodules: true

      # Ubuntu's getopt is GNU's (util-linux), which scripts/train.sh needs: no test may be skipped here.
      - name: Tests of the shell scripts
        run: |
          set -o pipefail
          tests/bats/helpers/bats-core/bin/bats --formatter tap --print-output-on-failure tests/bats | tee bats.tap
          if grep -q '# skip' bats.tap; then
            echo "Skipped tests (none may be skipped in CI):" >&2
            grep '# skip' bats.tap >&2
            exit 1
          fi

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        # A login shell activates the micromamba environment.
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7

      - uses: mamba-org/setup-micromamba@v3
        with:
          # The mesh image's environment (GDAL in sync with spack.yaml, gmsh's release). PROJ is not pinned: conda-forge's
          # GDAL 3.13.1 needs PROJ >= 9.8.1, while the training image has PROJ 9.7.0 (its pyproj wheel bundles 9.8.1);
          # a later step prints the versions.
          environment-file: containers/mesh-environment.yml
          cache-environment: true

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Install the package with the mesh extra and the dev group
        id: install
        run: |
          # Dependency groups need pip >= 25.1.
          python -m pip install --upgrade "pip >= 25.1"
          python -m pip install -e ".[mesh]" --group dev
          # gmsh is conda-forge's, not a wheel installed in its place.
          python -c "import gmsh; print('gmsh', gmsh.__version__); assert gmsh.__version__ == '4.15.2'"

      - name: GDAL, PROJ and pyproj versions (compare with the image)
        run: |
          python - <<'EOF'
          from osgeo import gdal, osr
          import pyproj
          proj = ".".join(str(f()) for f in (osr.GetPROJVersionMajor, osr.GetPROJVersionMinor, osr.GetPROJVersionMicro))
          lines = [
            f"GDAL {gdal.__version__}, PROJ (GDAL) {proj}",
            f"pyproj {pyproj.__version__}, PROJ (pyproj) {pyproj.proj_version_str}",
          ]
          print("\n".join(lines))
          EOF

      # A local hook running ty from the environment: nothing to download.
      - name: ty
        run: pre-commit run ty --all-files

      - name: Tests with coverage
        # Also when ty failed (both results are useful), but not without the environment.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest --cov --cov-report=xml --cov-report=term

      - name: Coverage summary
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          if [[ -f .coverage ]]; then
            coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

      # Coverage history and the README badge. The token is the repository's Codecov upload token (secret
      # CODECOV_TOKEN); an upload error does not fail the job, so an outage of Codecov cannot block a pull request.
      - uses: codecov/codecov-action@v7
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        with:
          files: coverage.xml
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7

      # GDAL only, as the training image has it (no gmsh).
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: moby-dick-core
          create-args: >-
            --override-channels -c conda-forge
            python=3.12 gdal=3.13.1 pip
          cache-environment: true

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-core-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Install the package without the mesh extra
        run: |
          python -m pip install --upgrade "pip >= 25.1"
          python -m pip install -e . --group dev

      - name: No mesh generator is installed or loaded
        run: |
          python - <<'EOF'
          import importlib.util
          import sys

          installed = [m for m in ("gmsh", "seamsh") if importlib.util.find_spec(m)]
          assert not installed, f"installed without the mesh extra: {installed}"
          import mobydick, mobydick.training, mobydick.graph_statistics.cli  # noqa: E401, F401

          loaded = sorted({"gmsh", "seamsh"} & set(sys.modules))
          assert not loaded, loaded
          EOF
          moby-dick --help

      - name: Tests (the mesh tests skip)
        run: python -m pytest
